[package]
name = "token-engine"
version = "0.1.0"
edition = "2021"
description = "WebAssembly compute engine for 13,000+ DTCG design token flattening, alias resolution, diffing, and exports."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
